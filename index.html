<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ YZ - هوش مصنوعی کامل</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --bg2: #111122;
            --bg3: #1a1a2e;
            --neon: #00ffff;
            --neon2: #0088ff;
            --danger: #ff0044;
            --text: #e0e0e0;
            --text2: #ffffff;
            --border: #00ffff33;
            --radius: 16px;
            --radius-sm: 10px;
            --gradient: linear-gradient(135deg, #00ffff, #0088ff);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Vazirmatn',Tahoma; background:var(--bg); color:var(--text); height:100vh; display:flex; overflow:hidden; direction:rtl; }
        
        .sidebar { width:280px; background:var(--bg2); border-left:1px solid var(--border); display:flex; flex-direction:column; padding:20px 15px; gap:12px; transition:0.3s; position:relative; }
        .sidebar.closed { width:0; padding:0; overflow:hidden; border:none; }
        .sidebar-content { display:flex; flex-direction:column; gap:12px; opacity:1; transition:0.3s; min-width:250px; }
        .sidebar.closed .sidebar-content { opacity:0; }
        .logo { text-align:center; font-size:26px; font-weight:900; color:var(--neon); text-shadow:0 0 30px var(--neon); animation:logoGlow 3s infinite; }
        @keyframes logoGlow { 0%,100%{text-shadow:0 0 30px var(--neon);} 50%{text-shadow:0 0 50px var(--neon),0 0 100px rgba(0,255,255,0.3);} }
        .btn-new { padding:13px; background:var(--gradient); color:#000; border:none; border-radius:var(--radius); font-weight:700; font-size:14px; cursor:pointer; transition:0.3s; }
        .btn-new:hover { transform:scale(1.03); box-shadow:0 6px 30px rgba(0,255,255,0.5); }
        .btn-new:disabled { opacity:0.4; cursor:not-allowed; transform:none; box-shadow:none; }
        .history { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
        .history-title { font-size:11px; color:#666; padding:8px 4px; border-bottom:1px solid var(--border); margin-bottom:5px; }
        .conv-item { padding:10px 12px; background:var(--bg3); border:1px solid transparent; border-radius:var(--radius-sm); cursor:pointer; font-size:12px; transition:0.3s; position:relative; }
        .conv-item:hover { border-color:var(--neon); background:rgba(0,255,255,0.05); }
        .conv-item.active { border-color:var(--neon); background:rgba(0,255,255,0.08); }
        .conv-title { font-weight:600; color:var(--text2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .conv-meta { font-size:10px; color:#888; margin-top:4px; }
        .conv-delete { position:absolute; top:6px; left:6px; width:20px; height:20px; border-radius:50%; background:rgba(255,0,68,0.15); border:1px solid rgba(255,0,68,0.3); color:var(--danger); font-size:9px; display:none; align-items:center; justify-content:center; cursor:pointer; }
        .conv-item:hover .conv-delete { display:flex; }
        .sidebar-footer { text-align:center; font-size:10px; color:#444; padding-top:8px; border-top:1px solid var(--border); }
        .toggle-sidebar { position:absolute; top:15px; right:-15px; width:30px; height:30px; background:var(--bg3); border:1px solid var(--border); border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--neon); z-index:10; font-size:14px; transition:0.3s; }
        .toggle-sidebar:hover { background:var(--neon); color:#000; }
        
        .main { flex:1; display:flex; flex-direction:column; position:relative; }
        .header { padding:15px 25px; background:var(--bg2); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
        .header-title { font-size:16px; font-weight:700; color:var(--text2); }
        .status { display:flex; align-items:center; gap:8px; color:var(--neon); font-size:12px; }
        .dot { width:10px; height:10px; border-radius:50%; background:var(--neon); box-shadow:0 0 15px var(--neon); animation:pulse 2s infinite; }
        @keyframes pulse { 0%,100%{box-shadow:0 0 15px var(--neon);} 50%{box-shadow:0 0 30px var(--neon);} }
        
        .chat-area { flex:1; overflow-y:auto; padding:25px; display:flex; flex-direction:column; gap:15px; }
        .message { max-width:75%; padding:14px 18px; border-radius:var(--radius); line-height:1.7; font-size:14px; animation:msgIn 0.4s ease; }
        @keyframes msgIn { from{opacity:0; transform:translateY(20px) scale(0.95);} to{opacity:1; transform:translateY(0) scale(1);} }
        .user-msg { align-self:flex-start; background:linear-gradient(135deg,#1a2a6c,#0d47a1); color:#fff; border-bottom-right-radius:4px; box-shadow:0 4px 20px rgba(13,71,161,0.4); }
        .ai-msg { align-self:flex-end; background:var(--bg3); border:1px solid var(--border); border-bottom-left-radius:4px; box-shadow:0 0 20px rgba(0,255,255,0.1); }
        .tag { font-size:10px; color:var(--neon); margin-top:6px; display:inline-block; padding:2px 10px; border-radius:20px; background:rgba(0,255,255,0.1); }
        .user-msg .tag { background:rgba(255,255,255,0.15); color:rgba(255,255,255,0.7); }
        
        .typing { display:inline-flex; gap:5px; }
        .typing span { width:8px; height:8px; border-radius:50%; background:var(--neon); animation:bounce 1.4s infinite; }
        .typing span:nth-child(2) { animation-delay:0.2s; }
        .typing span:nth-child(3) { animation-delay:0.4s; }
        @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:0.4;} 30%{transform:translateY(-8px);opacity:1;} }
        
        img { max-width:300px; border-radius:var(--radius-sm); margin-top:10px; border:1px solid var(--border); }
        audio { margin-top:10px; width:100%; }
        
        /* Stop Button */
        .stop-btn { display:none; padding:10px 16px; background:var(--danger); color:#fff; border:none; border-radius:var(--radius-sm); font-weight:700; cursor:pointer; font-size:12px; animation:pulse 1s infinite; }
        .stop-btn.active { display:flex; align-items:center; gap:6px; }
        
        .input-area { padding:20px 25px; background:var(--bg2); border-top:1px solid var(--border); }
        .input-container { display:flex; gap:12px; align-items:flex-end; background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; transition:0.3s; }
        .input-container:focus-within { border-color:var(--neon); box-shadow:0 0 30px rgba(0,255,255,0.2); }
        .input-container.disabled { opacity:0.5; pointer-events:none; }
        textarea { flex:1; background:transparent; border:none; color:var(--text); font-family:inherit; font-size:14px; resize:none; min-height:45px; max-height:150px; line-height:1.6; outline:none; }
        .btn-send { padding:12px 22px; background:var(--gradient); color:#000; border:none; border-radius:var(--radius-sm); font-weight:700; cursor:pointer; font-size:16px; transition:0.3s; }
        .btn-send:hover { transform:translateY(-2px); box-shadow:0 6px 30px rgba(0,255,255,0.5); }
        .btn-send:disabled { opacity:0.4; cursor:not-allowed; transform:none; box-shadow:none; }
        .char-count { font-size:10px; color:#666; text-align:left; margin-top:5px; }
        .toolbar { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:center; }
        .tool-btn { padding:9px 14px; background:var(--bg3); border:1px solid var(--border); color:var(--neon); border-radius:var(--radius-sm); cursor:pointer; font-size:12px; transition:0.3s; }
        .tool-btn:hover { background:rgba(0,255,255,0.08); border-color:var(--neon); box-shadow:0 0 15px rgba(0,255,255,0.2); }
        .tool-btn:disabled { opacity:0.4; cursor:not-allowed; pointer-events:none; }
        .tool-btn.recording { background:rgba(255,0,68,0.15); border-color:var(--danger); color:var(--danger); animation:pulse 1s infinite; }
        .tool-btn.listening { background:rgba(0,255,255,0.15); border-color:var(--neon); color:var(--neon); animation:pulse 1s infinite; }
        
        .modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); z-index:1000; align-items:center; justify-content:center; backdrop-filter:blur(10px); }
        .modal.active { display:flex; }
        .modal-box { background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius); padding:30px; width:400px; text-align:center; }
        .modal-box h3 { color:var(--neon); margin-bottom:15px; }
        .modal-box input { width:100%; padding:12px; background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius-sm); color:#fff; font-family:inherit; margin-bottom:12px; }
        .modal-box button { padding:12px 24px; background:var(--gradient); color:#000; border:none; border-radius:var(--radius-sm); font-weight:700; cursor:pointer; }
    </style>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
</head>
<body>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <div class="logo">⚡ YZ</div>
            <button class="btn-new" id="btnNewChat" onclick="newChat()">+ گفتگوی جدید</button>
            <div class="history" id="historyList">
                <div class="history-title">📋 تاریخچه</div>
            </div>
            <div class="sidebar-footer">🔮 نسخه ۵.۰</div>
        </div>
        <button class="toggle-sidebar" onclick="toggleSidebar()">◄</button>
    </div>
    
    <div class="main">
        <div class="header">
            <div class="header-title" id="headerTitle">گفتگوی جدید</div>
            <div class="status"><span class="dot"></span> ● <span id="statusText">آنلاین</span></div>
        </div>
        
        <div class="chat-area" id="chatArea"></div>
        
        <div class="input-area">
            <div class="input-container" id="inputContainer">
                <textarea id="input" placeholder="پیام خود را بنویسید..." oninput="updateBtn()" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
                <button class="btn-send" id="sendBtn" onclick="sendMessage()" disabled>🚀</button>
            </div>
            <div class="char-count" id="charCount">۰ / ۱۰,۰۰۰</div>
            <div class="toolbar">
                <button class="stop-btn" id="stopBtn" onclick="stopGeneration()">⏹️ توقف تولید</button>
                <button class="tool-btn" id="imgBtn" onclick="askForImage()">🎨 تصویر</button>
                <button class="tool-btn" id="musicBtn" onclick="askForMusic()">🎵 موسیقی</button>
                <button class="tool-btn" id="fileBtn" onclick="uploadFile()">📎 فایل</button>
                <button class="tool-btn" id="voiceBtn" onclick="toggleVoice()">🎤 صدا</button>
                <button class="tool-btn" id="listenBtn" onclick="toggleListen()">👂 گوش دادن</button>
                <button class="tool-btn" id="speakBtn" onclick="speakLast()">🔊 گفتار</button>
            </div>
            <input type="file" id="fileInput" style="display:none" multiple accept="image/*,audio/*,video/*,.pdf,.txt">
        </div>
    </div>

    <div class="modal" id="promptModal">
        <div class="modal-box">
            <h3 id="modalTitle">عنوان</h3>
            <input type="text" id="modalInput" placeholder="توضیح خود را بنویسید...">
            <button onclick="submitModal()">تأیید</button>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const headerTitle = document.getElementById('headerTitle');
        const statusText = document.getElementById('statusText');
        const stopBtn = document.getElementById('stopBtn');
        const inputContainer = document.getElementById('inputContainer');
        
        let conversations = [];
        let messages = [];
        let currentConvId = null;
        let isGenerating = false;
        let abortController = null;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;
        let recognition = null;
        let isListening = false;
        let modalType = null;

        function setGeneratingState(generating) {
            isGenerating = generating;
            if (generating) {
                statusText.textContent = 'در حال تولید...';
                stopBtn.classList.add('active');
                inputContainer.classList.add('disabled');
                sendBtn.disabled = true;
                document.getElementById('btnNewChat').disabled = true;
                document.getElementById('imgBtn').disabled = true;
                document.getElementById('musicBtn').disabled = true;
                document.getElementById('fileBtn').disabled = true;
                document.getElementById('voiceBtn').disabled = true;
                document.getElementById('listenBtn').disabled = true;
                document.getElementById('speakBtn').disabled = true;
            } else {
                statusText.textContent = 'آنلاین';
                stopBtn.classList.remove('active');
                inputContainer.classList.remove('disabled');
                document.getElementById('btnNewChat').disabled = false;
                document.getElementById('imgBtn').disabled = false;
                document.getElementById('musicBtn').disabled = false;
                document.getElementById('fileBtn').disabled = false;
                document.getElementById('voiceBtn').disabled = false;
                document.getElementById('listenBtn').disabled = false;
                document.getElementById('speakBtn').disabled = false;
                updateBtn();
            }
        }

        function stopGeneration() {
            if (abortController) {
                abortController.abort();
                abortController = null;
            }
            setGeneratingState(false);
            const typingEls = document.querySelectorAll('.typing');
            typingEls.forEach(el => el.closest('.message')?.remove());
            addMessage('ai', '⏹️ تولید متوقف شد.');
            statusText.textContent = 'آنلاین';
        }

        function loadDB() {
            const saved = localStorage.getItem('yz_db');
            if (saved) {
                const data = JSON.parse(saved);
                conversations = data.conversations || [];
                messages = data.messages || [];
                if (conversations.length > 0) loadConversation(conversations[0].id);
            }
        }
        function saveDB() { localStorage.setItem('yz_db', JSON.stringify({conversations, messages})); }
        function newChat() {
            if (isGenerating) return;
            currentConvId = null;
            headerTitle.textContent = 'گفتگوی جدید';
            chatArea.innerHTML = '';
            input.value = '';
            updateBtn();
            updateHistory();
        }
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('closed');
        }
        
        function addMessage(role, content, type='text') {
            const div = document.createElement('div');
            div.className = role === 'user' ? 'message user-msg' : 'message ai-msg';
            if (type === 'image') div.innerHTML = `<div>🎨 تصویر:</div><img src="${content}" onerror="this.src='https://via.placeholder.com/280x280/1a1a2e/00ffff?text=AI'"><div class="tag">🎨 Pollinations</div>`;
            else if (type === 'file') div.innerHTML = `<div>📎 ${content}</div><div class="tag">📎 فایل</div>`;
            else if (type === 'audio') div.innerHTML = `<div>🎵 موسیقی:</div><audio controls src="${content}"></audio><div class="tag">🎵 AI Music</div>`;
            else if (type === 'voice') div.innerHTML = `<div>🎤 پیام صوتی:</div><audio controls src="${content}"></audio><div class="tag">🎤 Voice</div>`;
            else div.innerHTML = `<div>${content.replace(/\n/g,'<br>')}</div><div class="tag">🧠 YZ AI</div>`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        function addTyping() {
            const div = document.createElement('div');
            div.className = 'message ai-msg';
            div.id = 'typing-' + Date.now();
            div.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div.id;
        }
        function removeTyping(id) { const el = document.getElementById(id); if (el) el.remove(); }

        async function sendMessage(text) {
            const prompt = text || input.value.trim();
            if (!prompt || isGenerating) return;
            
            setGeneratingState(true);
            
            if (!currentConvId) {
                const conv = { id: Date.now(), title: prompt.substring(0,35), createdAt: new Date().toISOString(), count: 0 };
                conversations.unshift(conv);
                currentConvId = conv.id;
                headerTitle.textContent = conv.title;
            }
            
            addMessage('user', prompt);
            messages.push({ convId: currentConvId, role: 'user', content: prompt });
            input.value = '';
            updateBtn();
            
            const typingId = addTyping();
            abortController = new AbortController();
            
            try {
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai`, {
                    signal: abortController.signal
                });
                const aiText = await response.text();
                removeTyping(typingId);
                addMessage('ai', aiText);
                messages.push({ convId: currentConvId, role: 'ai', content: aiText });
                const conv = conversations.find(c => c.id === currentConvId);
                if (conv) conv.count = messages.filter(m => m.convId === currentConvId).length;
                saveDB();
                updateHistory();
                speakText(aiText);
            } catch(err) {
                removeTyping(typingId);
                if (err.name === 'AbortError') {
                    addMessage('ai', '⏹️ تولید متوقف شد.');
                } else {
                    addMessage('ai', 'متأسفم، خطایی رخ داد.');
                }
            } finally {
                abortController = null;
                setGeneratingState(false);
            }
        }

        function askForImage() {
            if (isGenerating) return;
            modalType = 'image';
            document.getElementById('modalTitle').textContent = '🎨 چه تصویری می‌خواهید؟';
            document.getElementById('modalInput').placeholder = 'مثلاً: غروب در ساحل با رنگ‌های نئونی...';
            document.getElementById('modalInput').value = '';
            document.getElementById('promptModal').classList.add('active');
            document.getElementById('modalInput').focus();
        }
        function askForMusic() {
            if (isGenerating) return;
            modalType = 'music';
            document.getElementById('modalTitle').textContent = '🎵 چه موسیقی می‌خواهید؟';
            document.getElementById('modalInput').placeholder = 'مثلاً: موسیقی آرام پیانو...';
            document.getElementById('modalInput').value = '';
            document.getElementById('promptModal').classList.add('active');
            document.getElementById('modalInput').focus();
        }
        function submitModal() {
            const value = document.getElementById('modalInput').value.trim();
            if (!value) return;
            document.getElementById('promptModal').classList.remove('active');
            if (modalType === 'image') generateImage(value);
            else if (modalType === 'music') generateMusic(value);
        }
        function generateImage(prompt) {
            if (isGenerating) return;
            setGeneratingState(true);
            addMessage('user', `🎨 تصویر: ${prompt}`);
            const typingId = addTyping();
            
            setTimeout(() => {
                removeTyping(typingId);
                const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&seed=${Date.now()}`;
                addMessage('ai', url, 'image');
                messages.push({ convId: currentConvId, role: 'ai', content: url, type: 'image' });
                saveDB();
                setGeneratingState(false);
            }, 2000);
        }
        function generateMusic(prompt) {
            if (isGenerating) return;
            setGeneratingState(true);
            addMessage('user', `🎵 موسیقی: ${prompt}`);
            const typingId = addTyping();
            
            setTimeout(() => {
                removeTyping(typingId);
                addMessage('ai', `🎵 در حال ساخت "${prompt}"...\n\nتوضیح: یک قطعه ${prompt} با ملودی دلنشین.`);
                messages.push({ convId: currentConvId, role: 'ai', content: `موسیقی: ${prompt}` });
                saveDB();
                setGeneratingState(false);
            }, 2000);
        }

        function uploadFile() { 
            if (isGenerating) return;
            document.getElementById('fileInput').click(); 
        }
        document.getElementById('fileInput').addEventListener('change', function(e) {
            for (const file of e.target.files) {
                const size = (file.size/1024).toFixed(1) + ' KB';
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = ev => addMessage('user', ev.target.result, 'image');
                    reader.readAsDataURL(file);
                } else if (file.type.startsWith('audio/')) {
                    const url = URL.createObjectURL(file);
                    addMessage('user', url, 'audio');
                } else {
                    addMessage('user', file.name + ' (' + size + ')', 'file');
                }
            }
            this.value = '';
        });

        async function toggleVoice() {
            if (isGenerating) return;
            const btn = document.getElementById('voiceBtn');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const url = URL.createObjectURL(blob);
                        addMessage('user', url, 'voice');
                        stream.getTracks().forEach(t => t.stop());
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    btn.classList.add('recording');
                    btn.textContent = '⏹️ توقف';
                } catch(err) {
                    alert('دسترسی به میکروفون ممکن نیست');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.classList.remove('recording');
                btn.textContent = '🎤 صدا';
            }
        }

        async function toggleListen() {
            if (isGenerating) return;
            const btn = document.getElementById('listenBtn');
            if (!isListening) {
                recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
                recognition.lang = 'fa-IR';
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.onresult = (event) => {
                    const text = event.results[0][0].transcript;
                    input.value = text;
                    updateBtn();
                    sendMessage(text);
                };
                recognition.onend = () => {
                    isListening = false;
                    btn.classList.remove('listening');
                    btn.textContent = '👂 گوش دادن';
                };
                recognition.start();
                isListening = true;
                btn.classList.add('listening');
                btn.textContent = '👂 در حال گوش دادن...';
            } else {
                recognition.stop();
                isListening = false;
                btn.classList.remove('listening');
                btn.textContent = '👂 گوش دادن';
            }
        }

        function speakLast() {
            if (isGenerating) return;
            const last = messages[messages.length-1];
            if (last && last.role === 'ai') speakText(last.content);
        }
        function speakText(text) {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'fa-IR';
            u.rate = 1;
            speechSynthesis.speak(u);
        }

        function updateBtn() {
            sendBtn.disabled = input.value.trim().length === 0 || isGenerating;
            document.getElementById('charCount').textContent = input.value.length.toLocaleString('fa-IR') + ' / ۱۰,۰۰۰';
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 150) + 'px';
        }
        function updateHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '<div class="history-title">📋 تاریخچه</div>';
            conversations.forEach(conv => {
                const item = document.createElement('div');
                item.className = 'conv-item' + (conv.id === currentConvId ? ' active' : '');
                item.innerHTML = `<div class="conv-title">${conv.title}</div><div class="conv-meta">${conv.count || 0} پیام</div><button class="conv-delete" onclick="event.stopPropagation();deleteConv(${conv.id})">✕</button>`;
                item.onclick = () => loadConversation(conv.id);
                list.appendChild(item);
            });
        }
        function loadConversation(convId) {
            if (isGenerating) return;
            const conv = conversations.find(c => c.id === convId);
            if (!conv) return;
            currentConvId = convId;
            headerTitle.textContent = conv.title;
            chatArea.innerHTML = '';
            messages.filter(m => m.convId === convId).forEach(m => {
                if (m.type === 'image') addMessage(m.role, m.content, 'image');
                else addMessage(m.role, m.content);
            });
            updateHistory();
        }
        function deleteConv(convId) {
            if (isGenerating) return;
            if (!confirm('حذف این گفتگو؟')) return;
            conversations = conversations.filter(c => c.id !== convId);
            messages = messages.filter(m => m.convId !== convId);
            if (currentConvId === convId) newChat();
            saveDB();
            updateHistory();
        }

        document.getElementById('promptModal').addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('active');
        });
        document.getElementById('modalInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') submitModal();
        });

        loadDB();
        updateHistory();
        updateBtn();
    </script>
</body>
</html>
