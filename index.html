<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ YZ - وای زد | همه‌چیزتمام</title>
    <style>
        /* ============ RESET & BASE ============ */
        :root {
            --bg-dark: #0a0a0f;
            --bg-darker: #050508;
            --bg-panel: #111122;
            --neon-primary: #00ffff;
            --neon-secondary: #0088ff;
            --neon-danger: #ff0044;
            --text-primary: #e0e0e0;
            --text-bright: #ffffff;
            --text-dim: #666;
            --glass-bg: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(0, 255, 255, 0.15);
            --sidebar-width: 280px;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Vazirmatn', 'Segoe UI', Tahoma, 'Iranian Sans', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            font-family: var(--font);
            background: var(--bg-dark);
            color: var(--text-primary);
            overflow: hidden;
            direction: rtl;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--neon-primary);
            border-radius: 3px;
            opacity: 0.5;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--neon-secondary);
        }

        button {
            cursor: pointer;
            font-family: var(--font);
            border: none;
            outline: none;
            background: none;
            color: inherit;
        }

        input,
        textarea,
        select {
            font-family: var(--font);
            outline: none;
            border: none;
            background: none;
            color: inherit;
        }

        /* ============ APP LAYOUT ============ */
        .app-container {
            display: flex;
            flex-direction: row;
            height: 100vh;
            width: 100vw;
            background: var(--bg-dark);
            position: relative;
            overflow: hidden;
        }

        /* ============ SIDEBAR ============ */
        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--bg-darker);
            border-left: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 20px 16px;
            gap: 14px;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            transition: var(--transition);
        }

        .sidebar-logo {
            text-align: center;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--neon-primary);
            text-shadow:
                0 0 20px var(--neon-primary),
                0 0 40px rgba(0, 255, 255, 0.35),
                0 0 80px rgba(0, 255, 255, 0.2);
            animation: logoPulse 3s ease-in-out infinite;
            user-select: none;
            padding: 8px 0;
        }

        @keyframes logoPulse {
            0%,
            100% {
                text-shadow: 0 0 20px var(--neon-primary), 0 0 40px rgba(0, 255, 255, 0.35), 0 0 80px rgba(0, 255, 255, 0.2);
            }
            50% {
                text-shadow: 0 0 30px var(--neon-primary), 0 0 60px rgba(0, 255, 255, 0.5), 0 0 100px rgba(0, 255, 255, 0.3);
            }
        }

        .btn-new-chat {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 20px;
            border-radius: var(--radius);
            background: linear-gradient(135deg, var(--neon-primary), var(--neon-secondary));
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 20px rgba(0, 255, 255, 0.25);
            border: none;
            position: relative;
            overflow: hidden;
        }

        .btn-new-chat:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 30px rgba(0, 255, 255, 0.45);
        }

        .btn-new-chat:active {
            transform: scale(0.97);
        }

        .btn-new-chat::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 60%);
            animation: btnShine 3s ease-in-out infinite;
        }

        @keyframes btnShine {
            0%,
            100% {
                transform: translate(-30%, -30%);
                opacity: 0;
            }
            50% {
                transform: translate(30%, 30%);
                opacity: 0.6;
            }
        }

        .model-selector {
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            appearance: none;
            -webkit-appearance: none;
            width: 100%;
            position: relative;
        }

        .model-selector option {
            background: var(--bg-panel);
            color: var(--text-primary);
            padding: 8px;
        }

        .model-selector:hover {
            border-color: var(--neon-primary);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.15);
        }

        .model-selector:focus {
            border-color: var(--neon-primary);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.25);
        }

        .conversation-history {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 4px 0;
        }

        .conversation-history-title {
            font-size: 0.8rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 8px 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 4px;
        }

        .conv-item {
            padding: 12px 14px;
            border-radius: var(--radius-sm);
            background: var(--glass-bg);
            border: 1px solid transparent;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
        }

        .conv-item:hover {
            border-color: var(--neon-primary);
            background: rgba(0, 255, 255, 0.05);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
        }

        .conv-item.active {
            border-color: var(--neon-primary);
            background: rgba(0, 255, 255, 0.08);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.15);
        }

        .conv-item-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-bright);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .conv-item-meta {
            font-size: 0.7rem;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .conv-item-delete {
            position: absolute;
            top: 8px;
            left: 8px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(255, 0, 68, 0.15);
            border: 1px solid rgba(255, 0, 68, 0.3);
            color: var(--neon-danger);
            font-size: 0.7rem;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
        }

        .conv-item:hover .conv-item-delete {
            display: flex;
        }

        .conv-item-delete:hover {
            background: var(--neon-danger);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 68, 0.4);
        }

        .sidebar-footer {
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hidden-phrase {
            text-align: center;
            font-size: 0.75rem;
            color: rgba(0, 255, 255, 0.13);
            cursor: pointer;
            user-select: none;
            padding: 6px 0;
            transition: var(--transition);
            letter-spacing: 2px;
        }

        .hidden-phrase:hover {
            color: rgba(0, 255, 255, 0.25);
        }

        .sidebar-version {
            text-align: center;
            font-size: 0.7rem;
            color: #444;
            letter-spacing: 0.5px;
        }

        /* ============ MAIN AREA ============ */
        .main-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-dark);
            position: relative;
            overflow: hidden;
            min-width: 0;
        }

        .main-header {
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            position: relative;
            z-index: 5;
        }

        .main-header-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-bright);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 60%;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--neon-primary);
            letter-spacing: 0.5px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--neon-primary);
            box-shadow: 0 0 10px var(--neon-primary), 0 0 20px rgba(0, 255, 255, 0.5);
            animation: dotPulse 2s ease-in-out infinite;
        }

        @keyframes dotPulse {
            0%,
            100% {
                box-shadow: 0 0 10px var(--neon-primary), 0 0 20px rgba(0, 255, 255, 0.5);
            }
            50% {
                box-shadow: 0 0 20px var(--neon-primary), 0 0 40px rgba(0, 255, 255, 0.8);
            }
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: var(--radius);
            position: relative;
            animation: msgIn 0.3s ease-out;
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            line-height: 1.7;
        }

        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(15px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message.user {
            align-self: flex-start;
            background: linear-gradient(135deg, #1a2a6c, #0d47a1);
            color: var(--text-bright);
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 20px rgba(13, 71, 161, 0.35);
            margin-left: auto;
        }

        .message.ai {
            align-self: flex-end;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-bottom-right-radius: 4px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
        }

        .message.ai.thinking {
            border-color: rgba(0, 255, 255, 0.4);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
            animation: thinkingGlow 1.5s ease-in-out infinite;
        }

        @keyframes thinkingGlow {
            0%,
            100% {
                box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
            }
            50% {
                box-shadow: 0 0 35px rgba(0, 255, 255, 0.3);
            }
        }

        .message-model-tag {
            display: inline-block;
            font-size: 0.65rem;
            padding: 2px 8px;
            border-radius: 20px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.25);
            color: var(--neon-primary);
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        .message.user .message-model-tag {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.8);
        }

        .typing-indicator {
            display: inline-flex;
            gap: 5px;
            align-items: center;
            padding: 4px 0;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--neon-primary);
            animation: typingBounce 1.4s ease-in-out infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingBounce {
            0%,
            60%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        .message-image {
            max-width: 300px;
            max-height: 300px;
            border-radius: var(--radius-sm);
            margin-top: 8px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            object-fit: cover;
        }

        .message-file {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border);
            margin-top: 8px;
            font-size: 0.8rem;
        }

        /* ============ INPUT AREA ============ */
        .input-area {
            padding: 16px 24px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            z-index: 5;
        }

        .input-container {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            padding: 12px 16px;
            transition: var(--transition);
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }

        .input-container:focus-within {
            border-color: var(--neon-primary);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.15);
        }

        .input-textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 0.95rem;
            resize: none;
            min-height: 42px;
            max-height: 180px;
            line-height: 1.6;
            padding: 4px 0;
            overflow-y: auto;
        }

        .input-textarea::placeholder {
            color: #555;
        }

        .btn-send {
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            background: linear-gradient(135deg, var(--neon-primary), var(--neon-secondary));
            color: #000;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 20px rgba(0, 255, 255, 0.3);
            border: none;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-send:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(0, 255, 255, 0.5);
        }
        .btn-send:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(0, 255, 255, 0.2);
        }
        .btn-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .char-counter {
            font-size: 0.7rem;
            color: var(--text-dim);
            text-align: left;
            padding: 0 4px;
            transition: color 0.3s;
        }
        .char-counter.warning {
            color: #ffaa00;
        }
        .char-counter.danger {
            color: var(--neon-danger);
            font-weight: 700;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .tool-btn {
            padding: 8px 14px;
            border-radius: var(--radius-sm);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .tool-btn:hover {
            border-color: var(--neon-primary);
            background: rgba(0, 255, 255, 0.08);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .tool-btn.recording {
            background: rgba(255, 0, 68, 0.15);
            border-color: var(--neon-danger);
            color: var(--neon-danger);
            animation: recPulse 1s ease-in-out infinite;
        }

        @keyframes recPulse {
            0%,
            100% {
                box-shadow: 0 0 10px rgba(255, 0, 68, 0.2);
            }
            50% {
                box-shadow: 0 0 25px rgba(255, 0, 68, 0.5);
            }
        }

        /* ============ ADMIN PANEL OVERLAY ============ */
        .admin-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.96);
            z-index: 1000;
            overflow-y: auto;
            padding: 30px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            animation: adminFadeIn 0.4s ease-out;
        }

        .admin-overlay.active {
            display: block;
        }

        @keyframes adminFadeIn {
            from {
                opacity: 0;
                transform: scale(0.98);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .admin-container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--bg-panel);
            border-radius: var(--radius);
            padding: 30px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 0 60px rgba(0, 255, 255, 0.15);
            position: relative;
        }

        .admin-close-btn {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 0, 68, 0.15);
            border: 1px solid rgba(255, 0, 68, 0.4);
            color: var(--neon-danger);
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            z-index: 10;
        }

        .admin-close-btn:hover {
            background: var(--neon-danger);
            color: #fff;
            box-shadow: 0 0 25px rgba(255, 0, 68, 0.5);
        }

        .admin-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--neon-primary);
            text-align: center;
            margin-bottom: 24px;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            letter-spacing: 1px;
        }

        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 20px;
            text-align: center;
            transition: var(--transition);
        }

        .stat-card:hover {
            border-color: var(--neon-primary);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.15);
        }

        .stat-card-icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .stat-card-value {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-bright);
            margin-bottom: 4px;
        }
        .stat-card-label {
            font-size: 0.8rem;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        .admin-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
            justify-content: center;
        }

        .admin-btn {
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .admin-btn.primary {
            background: rgba(0, 255, 255, 0.1);
            border-color: var(--neon-primary);
            color: var(--neon-primary);
        }
        .admin-btn.primary:hover {
            background: rgba(0, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }
        .admin-btn.danger {
            background: rgba(255, 0, 68, 0.1);
            border-color: var(--neon-danger);
            color: var(--neon-danger);
        }
        .admin-btn.danger:hover {
            background: rgba(255, 0, 68, 0.2);
            box-shadow: 0 0 20px rgba(255, 0, 68, 0.2);
        }

        .admin-table-section {
            margin-top: 20px;
            overflow-x: auto;
        }

        .admin-table-section h3 {
            font-size: 1.1rem;
            color: var(--neon-secondary);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .admin-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .admin-table th {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-bright);
            padding: 12px 14px;
            text-align: right;
            border-bottom: 1px solid var(--glass-border);
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .admin-table td {
            padding: 10px 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: var(--text-primary);
        }

        .admin-table tr:hover td {
            background: rgba(0, 255, 255, 0.03);
        }

        .table-action-btn {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
            margin: 0 2px;
        }
        .table-action-btn.edit {
            background: rgba(0, 136, 255, 0.1);
            border-color: rgba(0, 136, 255, 0.3);
            color: var(--neon-secondary);
        }

        async function loadDB() {
            try {
                const response = await fetch(
                    `https://api.jsonbin.io/v3/b/${CONFIG.JSONBIN_BIN_ID}/latest`, {
                        headers: { 'X-Master-Key': CONFIG.JSONBIN_KEY },
                    }
                );
                if (response.ok) {
                    const data = await response.json();
                    if (data && data.record) {
                        state.conversations = data.record.conversations || [];
                        state.messages = data.record.messages || [];
                        state.settings = data.record.settings || state.settings;
                        state.currentUser = data.record.users && data.record.users[0] || state.currentUser;
                        return true;
                    }
                }
                return false;
            } catch (err) {
                console.warn('JSONbin load error, using localStorage:', err);
                const local = localStorage.getItem('yz_db');
                if (local) {
                    const parsed = JSON.parse(local);
                    state.conversations = parsed.conversations || [];
                    state.messages = parsed.messages || [];
                    state.settings = parsed.settings || state.settings;
                    state.currentUser = parsed.users && parsed.users[0] || state.currentUser;
                }
                return false;
            }
        }

        async function saveDB() {
            const payload = {
                users: [state.currentUser],
                conversations: state.conversations,
                messages: state.messages,
                settings: state.settings,
            };
            localStorage.setItem('yz_db', JSON.stringify(payload));
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${CONFIG.JSONBIN_BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': CONFIG.JSONBIN_KEY,
                    },
                    body: JSON.stringify(payload),
                });
            } catch (err) {
                console.warn('JSONbin save error:', err);
            }
        }

        // =====================================================
        // ============ UTILITY FUNCTIONS ============
        // =====================================================
        function formatPersianDate(isoString) {
            try {
                const date = new Date(isoString);
                return new Intl.DateTimeFormat('fa-IR', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                }).format(date);
            } catch {
                return 'نامشخص';
            }
        }

        function generateId() {
            return Date.now() + Math.floor(Math.random() * 1000);
        }

        function generateConversationTitle(firstMessage) {
            const trimmed = firstMessage.trim();
            if (trimmed.length <= 40) return trimmed;
            return trimmed.substring(0, 40) + '…';
        }

        function getModelLabel(model) {
            const labels = {
                auto: '🤖 Auto-Router',
                openai: '🧠 GPT-4o',
                gemini: '🌟 Gemini Pro',
                claude: '💎 Claude 3.5',
                dalle: '🎨 DALL-E',
            };
            return labels[model] || model;
        }

        // =====================================================
        // ============ AI API FUNCTIONS ============
        // =====================================================
        async function getAIResponse(prompt, model, onStream) {
            if (model === 'openai') {
                return await callOpenAI(prompt, onStream);
            } else if (model === 'gemini') {
                return await callGemini(prompt, onStream);
            } else if (model === 'claude') {
                return await callClaude(prompt, onStream);
            } else if (model === 'auto') {
                try {
                    return await callOpenAI(prompt, onStream);
                } catch (err1) {
                    console.warn('OpenAI failed, trying Gemini...', err1);
                    try {
                        return await callGemini(prompt, onStream);
                    } catch (err2) {
                        console.warn('Gemini failed, trying Claude...', err2);
                        return await callClaude(prompt, onStream);
                    }
                }
            } else if (model === 'dalle') {
                return await generateImageResponse(prompt);
            }
            return 'مدل ناشناخته است.';
        }

        async function callOpenAI(prompt, onStream) {
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${CONFIG.OPENAI_KEY}`,
                },
                body: JSON.stringify({
                    model: 'gpt-4o',
                    messages: [{ role: 'user', content: prompt }],
                    max_tokens: 1000,
                    temperature: 0.7,
                }),
            });
            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`OpenAI API error: ${response.status} - ${errorText.substring(0, 200)}`);
            }
            const data = await response.json();
            const text = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message
                .content : 'پاسخی دریافت نشد.';
            if (onStream) await simulateStream(text, onStream);
            return text;
        }

        async function callGemini(prompt, onStream) {
            const response = await fetch(
                `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${CONFIG.GEMINI_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { maxOutputTokens: 1000, temperature: 0.7 },
                    }),
                }
            );
            if (!response.ok) {
                throw new Error(`Gemini API error: ${response.status}`);
            }
            const data = await response.json();
            const text = data.candidates && data.candidates[0] && data.candidates[0].content &&
                data.candidates[0].content.parts && data.candidates[0].content.parts[0] ?
                data.candidates[0].content.parts[0].text : 'پاسخی دریافت نشد.';
            if (onStream) await simulateStream(text, onStream);
            return text;
        }

        async function callClaude(prompt, onStream) {
            const response = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': CONFIG.CLAUDE_KEY,
                    'anthropic-version': '2023-06-01',
                },
                body: JSON.stringify({
                    model: 'claude-3-5-sonnet-20241022',
                    max_tokens: 1000,
                    messages: [{ role: 'user', content: prompt }],
                }),
            });
            if (!response.ok) {
                throw new Error(`Claude API error: ${response.status}`);
            }
            const data = await response.json();
            const text = data.content && data.content[0] ? data.content[0].text : 'پاسخی دریافت نشد.';
            if (onStream) await simulateStream(text, onStream);
            return text;
        }

        async function simulateStream(fullText, onStream) {
            const chunks = fullText.match(/.{1,3}/g) || [fullText];
            let accumulated = '';
            for (const chunk of chunks) {
                accumulated += chunk;
                onStream && onStream(accumulated, false);
                await new Promise(resolve => setTimeout(resolve, 20 + Math.random() * 30));
            }
            onStream && onStream(fullText, true);
        }

        async function generateImageResponse(prompt) {
            try {
                const response = await fetch('https://api.fal.ai/v1/comfy/run', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Key ${CONFIG.FAL_KEY}`,
                    },
                    body: JSON.stringify({
                        workflow: 'text-to-image',
                        prompt: prompt,
                        negative_prompt: 'blurry, low quality',
                    }),
                });
                if (!response.ok) {
                    throw new Error(`Fal.ai API error: ${response.status}`);
                }
                const data = await response.json();
                const imageUrl = data.images && data.images[0] ? data.images[0].url :
                    data.url || 'https://via.placeholder.com/512x512/1a1a2e/00ffff?text=YZ+Generated+Image';
                return {
                    type: 'image',
                    url: imageUrl,
                    caption: `🎨 تصویر تولید شده: "${prompt.substring(0, 60)}"`,
                };
            } catch (err) {
                console.error('Image generation error:', err);
                return {
                    type: 'image',
                    url: 'https://via.placeholder.com/512x512/1a1a2e/00ffff?text=YZ+Image+Generation+Demo',
                    caption: `🎨 تصویر (حالت نمایشی به دلیل خطا): "${prompt.substring(0, 60)}"`,
                };
            }
        }

            const textarea = document.getElementById('inputTextarea');
            const prompt = textarea.value.trim();
            if (!prompt) {
                alert('لطفاً ابتدا توضیح عکس را بنویسید.');
                return;
            }
            const imageResult = await generateImageResponse(prompt);
            addMessage('user', `🎨 ${prompt}`, CONFIG.currentModel || 'dalle');
            if (imageResult.type === 'image') {
                addMessage('ai', imageResult.caption, 'dalle', imageResult.url);
            } else {
                addMessage('ai', imageResult, 'dalle');
            }
            textarea.value = '';
            onInputChange();
        }

            const prompt = textarea.value.trim() || 'یک ملودی آرامش‌بخش سایبرپانکی';

                'در نسخه‌های آینده، موسیقی با استفاده از مدل‌های پیشرفته تولید خواهد شد.';
            await simulateStream(response, (text, done) => {
                updateStreamingMessage(text, done);
            });
            addMessage('ai', response, 'auto');
            textarea.value = '';
            onInputChange();
        }

        async function searchNews() {
            const textarea = document.getElementById('inputTextarea');
            const query = textarea.value.trim() || 'تکنولوژی هوش مصنوعی';
            try {
                const response = await fetch(
                    `https://newsapi.org/v2/everything?q=${encodeURIComponent(query)}&apiKey=${CONFIG.NEWSAPI_KEY}&pageSize=5&language=fa`, {
                        headers: { 'Accept': 'application/json' },
                    }
                );
                if (!response.ok) {
                    throw new Error(`NewsAPI error: ${response.status}`);
                }
                const data = await response.json();
                const articles = data.articles || [];
                let newsText = `📰 نتایج جستجوی خبر برای "${query}":\n\n`;
                if (articles.length === 0) {
                    newsText += 'هیچ خبری یافت نشد.';
                } else {
                    articles.forEach((article, index) => {
                        newsText +=
                            `${index + 1}. **${article.title || 'بدون عنوان'}**\n   ${article.description || 'بدون توضیح'}\n   [منبع: ${article.source?.name || 'نامشخص'}](${article.url})\n\n`;
                    });
                }
                addMessage('user', `📰 ${query}`, 'news');
                await simulateStream(newsText, (text, done) => {
                    updateStreamingMessage(text, done);
                });
                addMessage('ai', newsText, 'news');
            } catch (err) {
                console.error('News search error:', err);
                const fallbackNews = `📰 حالت نمایشی جستجوی خبر برای "${query}":\n\n` +
                    '1. **هوش مصنوعی در حال تغییر جهان است**\n   پیشرفت‌های اخیر در حوزه یادگیری عمیق...\n   [منبع: نمایشی](https://example.com)\n\n' +
                    '2. **تکنولوژی‌های نوظهور در سال ۲۰۲۶**\n   روندهای کلیدی...\n   [منبع: نمایشی](https://example.com)\n\n';
                addMessage('user', `📰 ${query}`, 'news');
                await simulateStream(fallbackNews, (text, done) => {
                    updateStreamingMessage(text, done);
                });
                addMessage('ai', fallbackNews, 'news');
            }
            textarea.value = '';
            onInputChange();
        }

        // =====================================================
        // ============ VOICE RECORDING ============
        // =====================================================
        async function toggleRecording() {
            const btn = document.getElementById('btnRecord');
            if (!state.isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    state.mediaRecorder = new MediaRecorder(stream);
                    state.audioChunks = [];
                    state.mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) state.audioChunks.push(event.data);
                    };
                    state.mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(state.audioChunks, { type: 'audio/webm' });
                        const audioUrl = URL.createObjectURL(audioBlob);
                        addMessage('user', '🎤 (پیام صوتی ضبط شده)', 'voice', audioUrl);
                        stream.getTracks().forEach(track => track.stop());
                    };
                    state.mediaRecorder.start();
                    state.isRecording = true;
                    btn.classList.add('recording');
                    btn.textContent = '⏹️ توقف ضبط';
                } catch (err) {
                    console.error('Recording error:', err);
                    alert('دسترسی به میکروفون امکان‌پذیر نیست.');
                }
            } else {
                state.mediaRecorder.stop();
                state.isRecording = false;
                btn.classList.remove('recording');
                btn.textContent = '🎤 ضبط صدا';
            }
        }

        // =====================================================
        // ============ TEXT-TO-SPEECH ============
        // =====================================================
        function speakLastMessage() {
            if (state.messages.length === 0) return;
            const lastMsg = state.messages[state.messages.length - 1];
            if (lastMsg.role === 'ai' && lastMsg.content) {
                const utterance = new SpeechSynthesisUtterance(lastMsg.content);
                utterance.lang = 'fa-IR';
                utterance.rate = 1;
                utterance.pitch = 1;
                window.speechSynthesis.cancel();
                window.speechSynthesis.speak(utterance);
            }
        }

        // =====================================================
        // ============ FILE UPLOAD ============
        // =====================================================
        function triggerFileUpload() {
            document.getElementById('fileInput').click();
        }

        function handleFileUpload(event) {
            const files = event.target.files;
            if (!files || files.length === 0) return;
            for (const file of files) {
                const fileName = file.name;
                const fileSize = (file.size / 1024).toFixed(1) + ' KB';
                const fileType = file.type || 'نامشخص';
                const icon = getFileIcon(fileType, fileName);
                if (fileType.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        addMessage('user', `${icon} ${fileName} (${fileSize})`, 'file', e.target.result);
                    };
                    reader.readAsDataURL(file);
                } else {
                    addMessage('user', `${icon} ${fileName} (${fileSize})`, 'file');
                }
            }
            event.target.value = '';
        }

        function getFileIcon(type, name) {
            if (type.startsWith('image/')) return '🖼️';
            if (type.startsWith('video/')) return '🎬';
            if (type.startsWith('audio/')) return '🎵';
            if (type === 'application/pdf') return '📄';
            if (name.endsWith('.doc') || name.endsWith('.docx')) return '📝';
            if (name.endsWith('.xls') || name.endsWith('.xlsx')) return '📊';
            if (name.endsWith('.ppt') || name.endsWith('.pptx')) return '📑';
            if (name.endsWith('.txt')) return '📃';
            return '📎';
        }

        // =====================================================
        // ============ CHAT FUNCTIONS ============
        // =====================================================
        function createNewConversation() {
            state.currentConversationId = null;
            state.hiddenClickCount = 0;
            document.getElementById('mainHeaderTitle').textContent = 'گفتگوی جدید';
            document.getElementById('chatArea').innerHTML = '';
            document.getElementById('inputTextarea').value = '';
            document.getElementById('inputTextarea').focus();
            onInputChange();
            updateConversationList();
        }

        function onModelChange() {
            state.currentModel = document.getElementById('modelSelector').value;
        }

        function onInputChange() {
            const textarea = document.getElementById('inputTextarea');
            const counter = document.getElementById('charCounter');
            const btnSend = document.getElementById('btnSend');
            const length = textarea.value.length;
            const max = CONFIG.MAX_CHARS;
            const warningThreshold = Math.floor(max * CONFIG.WARNING_THRESHOLD);

            counter.textContent = `${length.toLocaleString('fa-IR')} / ${max.toLocaleString('fa-IR')}`;
            counter.classList.remove('warning', 'danger');
            if (length >= max) {
                counter.classList.add('danger');
            } else if (length >= warningThreshold) {
                counter.classList.add('warning');
            }

            btnSend.disabled = length === 0 || state.isGenerating;

            // Auto-resize
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 180) + 'px';
        }

        function onInputKeydown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        async function sendMessage() {
            const textarea = document.getElementById('inputTextarea');
            const prompt = textarea.value.trim();
            if (!prompt || state.isGenerating) return;

            state.isGenerating = true;
            document.getElementById('btnSend').disabled = true;

            // Ensure conversation exists
            if (!state.currentConversationId) {
                const newConv = {
                    id: generateId(),
                    title: generateConversationTitle(prompt),
                    createdAt: new Date().toISOString(),
                    messageCount: 0,
                };
                state.conversations.unshift(newConv);
                state.currentConversationId = newConv.id;
                document.getElementById('mainHeaderTitle').textContent = newConv.title;
            }

            const convId = state.currentConversationId;
            const model = state.currentModel || 'auto';

            // Add user message
            addMessage('user', prompt, model);
            state.messages.push({
                convId: convId,
                role: 'user',
                content: prompt,
                model: model,
                timestamp: new Date().toISOString(),
            });

            // Update conversation message count
            const conv = state.conversations.find(c => c.id === convId);
            if (conv) conv.messageCount = state.messages.filter(m => m.convId === convId).length;

            // Clear input
            textarea.value = '';
            onInputChange();
            updateConversationList();
            await saveDB();

            // Show thinking indicator
            const thinkingId = addThinkingMessage();

            try {
                const response = await getAIResponse(prompt, model, (streamedText, done) => {
                    updateStreamingMessage(streamedText, done, thinkingId);
                });

                if (typeof response === 'object' && response.type === 'image') {
                    removeThinkingMessage(thinkingId);
                    addMessage('ai', response.caption, 'dalle', response.url);
                    state.messages.push({
                        convId: convId,
                        role: 'ai',
                        content: response.caption,
                        model: 'dalle',
                        timestamp: new Date().toISOString(),
                        imageUrl: response.url,
                    });
                } else {
                    removeThinkingMessage(thinkingId);
                    addMessage('ai', response, model);
                    state.messages.push({
                        convId: convId,
                        role: 'ai',
                        content: response,
                        model: model,
                        timestamp: new Date().toISOString(),
                    });
                }

                const conv2 = state.conversations.find(c => c.id === convId);
                if (conv2) conv2.messageCount = state.messages.filter(m => m.convId === convId).length;
                await saveDB();
                updateConversationList();

            } catch (err) {
                console.error('AI response error:', err);
                removeThinkingMessage(thinkingId);
                const errorMsg = '⚠️ خطا در ارتباط با هوش مصنوعی. لطفاً دوباره تلاش کنید.\n\n' +
                    'جزئیات: ' + (err.message || 'خطای ناشناخته');
                addMessage('ai', errorMsg, 'system');
                state.messages.push({
                    convId: convId,
                    role: 'ai',
                    content: errorMsg,
                    model: 'system',
                    timestamp: new Date().toISOString(),
                });
            } finally {
                state.isGenerating = false;
                document.getElementById('btnSend').disabled = false;
                onInputChange();
                scrollChatToBottom();
            }
        }

        function addMessage(role, content, model, imageUrl) {
            const chatArea = document.getElementById('chatArea');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role === 'user' ? 'user' : 'ai'}`;
            msgDiv.setAttribute('data-role', role);
            msgDiv.setAttribute('data-model', model);

            let html = '';
            if (role === 'user' && imageUrl && model === 'file') {
                html = `<div>${content}</div>`;
                if (imageUrl && imageUrl.startsWith('data:image')) {
                    html += `<img src="${imageUrl}" class="message-image" alt="uploaded image">`;
                }
            } else if (role === 'user' && imageUrl && model === 'voice') {
                html = `<div>${content}</div><audio controls src="${imageUrl}" style="width:100%;margin-top:8px;"></audio>`;
            } else if (role === 'ai' && imageUrl) {
                html = `<div>${content}</div><img src="${imageUrl}" class="message-image" alt="generated image">`;
            } else {
                html = `<div>${content}</div>`;
            }

            html += `<span class="message-model-tag">${getModelLabel(model)}</span>`;
            msgDiv.innerHTML = html;
            chatArea.appendChild(msgDiv);
            scrollChatToBottom();
        }

        function addThinkingMessage() {
            const chatArea = document.getElementById('chatArea');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai thinking';
            msgDiv.id = 'thinking-' + Date.now();
            msgDiv.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>` +
                `<span class="message-model-tag">در حال پردازش…</span>`;
            chatArea.appendChild(msgDiv);
            scrollChatToBottom();
            return msgDiv.id;
        }

        function removeThinkingMessage(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function updateStreamingMessage(text, done, thinkingId) {
            if (thinkingId) {
                const el = document.getElementById(thinkingId);
                if (el) {
                    el.classList.remove('thinking');
                    el.innerHTML =
                        `<div>${text.replace(/\n/g, '<br>')}</div><span class="message-model-tag">${getModelLabel(state.currentModel || 'auto')}</span>`;
                }
            }
            scrollChatToBottom();
        }

        function scrollChatToBottom() {
            const chatArea = document.getElementById('chatArea');
            setTimeout(() => {
                chatArea.scrollTop = chatArea.scrollHeight;
            }, 50);
        }

        function updateConversationList() {
            const list = document.getElementById('conversationList');
            const titleEl = document.querySelector('.conversation-history-title');
            list.innerHTML = '';
            if (titleEl) list.appendChild(titleEl);

            if (state.conversations.length === 0) {
                const empty = document.createElement('div');
                empty.style.cssText = 'text-align:center;padding:20px;color:#555;font-size:0.85rem;';
                empty.textContent = 'هنوز گفتگویی ندارید';
                list.appendChild(empty);
                return;
            }

            state.conversations.forEach(conv => {
                const item = document.createElement('div');
                item.className = 'conv-item' + (conv.id === state.currentConversationId ? ' active' : '');
                item.onclick = () => loadConversation(conv.id);
                item.innerHTML = `
                    <div class="conv-item-title">${conv.title}</div>
                    <div class="conv-item-meta">
                        <span>${formatPersianDate(conv.createdAt)}</span>
                        <span>${conv.messageCount || 0} پیام</span>
                    </div>
                    <button class="conv-item-delete" onclick="event.stopPropagation(); deleteConversation(${conv.id})">✕</button>
                `;
                list.appendChild(item);
            });
        }

        function loadConversation(convId) {
            const conv = state.conversations.find(c => c.id === convId);
            if (!conv) return;
            state.currentConversationId = convId;
            document.getElementById('mainHeaderTitle').textContent = conv.title;
            document.getElementById('chatArea').innerHTML = '';
            const msgs = state.messages.filter(m => m.convId === convId);
            msgs.forEach(msg => {
                if (msg.imageUrl) {
                    addMessage(msg.role, msg.content, msg.model, msg.imageUrl);
                } else {
                    addMessage(msg.role, msg.content, msg.model);
                }
            });
            updateConversationList();
            scrollChatToBottom();
        }

        function deleteConversation(convId) {
            if (!confirm('آیا از حذف این گفتگو مطمئن هستید؟')) return;
            state.conversations = state.conversations.filter(c => c.id !== convId);
            state.messages = state.messages.filter(m => m.convId !== convId);
            if (state.currentConversationId === convId) {
                createNewConversation();
            }
            saveDB();
            updateConversationList();
        }

        // =====================================================
        // ============ ADMIN PANEL ============
        // =====================================================
        function handleHiddenPhraseClick() {
            state.hiddenClickCount++;
            if (state.hiddenClickCount >= 3) {
                state.hiddenClickCount = 0;
                document.getElementById('passwordModal').classList.add('active');
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordError').style.display = 'none';
                setTimeout(() => document.getElementById('passwordInput').focus(), 100);
            }
        }

        function verifyPassword() {
            const input = document.getElementById('passwordInput').value;
            if (input === CONFIG.ADMIN_PASSWORD) {
                document.getElementById('passwordModal').classList.remove('active');
                openAdminPanel();
            } else {
                document.getElementById('passwordError').style.display = 'block';
                document.getElementById('passwordInput').value = '';
                document.getElementById('passwordInput').focus();
            }
        }

        function openAdminPanel() {
            document.getElementById('adminOverlay').classList.add('active');
            refreshAdminPanel();
        }

        function closeAdminPanel() {
            document.getElementById('adminOverlay').classList.remove('active');
        }

        function refreshAdminPanel() {
            document.getElementById('statUsers').textContent = '۱'; // Only admin user
            document.getElementById('statConversations').textContent = state.conversations.length.toLocaleString('fa-IR');
            document.getElementById('statMessages').textContent = state.messages.length.toLocaleString('fa-IR');

            // User table
            const userTable = document.getElementById('adminUserTable');
            userTable.innerHTML = '';
            const users = [state.currentUser];
            users.forEach(user => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${user.id}</td>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td>${formatPersianDate(user.createdAt)}</td>
                    <td>
                        <button class="table-action-btn edit" onclick="adminEditUser(${user.id})">✏️ ویرایش</button>
                        <button class="table-action-btn delete" onclick="adminDeleteUser(${user.id})">🗑️ حذف</button>
                    </td>
                `;
                userTable.appendChild(row);
            });

            // Conversation table
            const convTable = document.getElementById('adminConvTable');
            convTable.innerHTML = '';
            state.conversations.forEach(conv => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${conv.id}</td>
                    <td>${conv.title}</td>
                    <td>${formatPersianDate(conv.createdAt)}</td>
                    <td>${conv.messageCount || 0}</td>
                `;
                convTable.appendChild(row);
            });
        }

        function adminRefresh() {
            loadDB().then(() => {
                refreshAdminPanel();
                updateConversationList();
                alert('✅ داده‌ها بروزرسانی شدند.');
            });
        }

        function adminExportJSON() {
            const payload = {
                users: [state.currentUser],
                conversations: state.conversations,
                messages: state.messages,
                settings: state.settings,
                exportedAt: new Date().toISOString(),
            };
            const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `yz-backup-${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            alert('📤 فایل بکاپ دانلود شد.');
        }

        function adminClearAll() {
            const firstConfirm = confirm('⚠️ آیا مطمئن هستید می‌خواهید تمام داده‌ها پاک شوند؟');
            if (!firstConfirm) return;
            const secondConfirm = confirm('🗑️ این عملیات قابل بازگشت نیست! برای تأیید نهایی دوباره کلیک کنید.');
            if (!secondConfirm) return;
            state.conversations = [];
            state.messages = [];
            state.currentConversationId = null;
            saveDB();
            createNewConversation();
            refreshAdminPanel();
            updateConversationList();
            alert('🗑️ تمام داده‌ها پاک شدند.');
        }

        function adminEditUser(userId) {
            const newName = prompt('نام جدید:', state.currentUser.name);
            if (newName && newName.trim()) {
                state.currentUser.name = newName.trim();
                saveDB();
                refreshAdminPanel();
            }
        }

        function adminDeleteUser(userId) {
            if (!confirm('آیا از حذف این کاربر مطمئن هستید؟')) return;
            // Only allow deletion if there are other users, but since we only have one admin, prevent deletion
            alert('⚠️ کاربر مدیر قابل حذف نیست.');
        }

        // =====================================================
        // ============ MOBILE SIDEBAR ============
        // =====================================================
        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('mobile-open');
        }

        // =====================================================
        // ============ INITIALIZATION ============
        // =====================================================
        async function initApp() {
            document.getElementById('modelSelector').value = 'auto';
            state.currentModel = 'auto';
            await loadDB();
            updateConversationList();

            if (state.conversations.length > 0) {
                const lastConv = state.conversations[0];
                loadConversation(lastConv.id);
            } else {
                createNewConversation();
            }

            // Password modal Enter key
            document.getElementById('passwordInput').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') verifyPassword();
            });

            // Close admin panel on overlay click outside container
            document.getElementById('adminOverlay').addEventListener('click', (e) => {
                if (e.target === document.getElementById('adminOverlay')) {
                    closeAdminPanel();
                }
            });

            console.log('⚡ YZ Super-App initialized successfully');
            console.log('🔐 برای دسترسی به پنل مدیریت: سه بار روی "✦ آزادی ✦" کلیک کنید و رمز 1402 را وارد کنید.');
        }

        // Start the app
        initApp();
    </script>
</body>
