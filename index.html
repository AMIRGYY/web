<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ YZ - هوش مصنوعی کامل</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Vazirmatn',Tahoma; background:#0a0a0f; color:#e0e0e0; height:100vh; display:flex; overflow:hidden; direction:rtl; }
        
        .sidebar { width:260px; background:#111122; border-left:1px solid #00ffff33; display:flex; flex-direction:column; padding:20px 15px; gap:12px; }
        .logo { text-align:center; font-size:26px; font-weight:900; color:#00ffff; text-shadow:0 0 20px #00ffff; }
        .btn-new { padding:12px; background:linear-gradient(135deg,#00ffff,#0088ff); color:#000; border:none; border-radius:12px; font-weight:700; cursor:pointer; font-size:14px; }
        .btn-new:hover { opacity:0.8; }
        .history { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
        .history-title { font-size:11px; color:#666; padding:8px 4px; border-bottom:1px solid #00ffff22; margin-bottom:5px; }
        .conv-item { padding:10px 12px; background:#1a1a2e; border:1px solid transparent; border-radius:8px; cursor:pointer; font-size:12px; transition:0.3s; }
        .conv-item:hover { border-color:#00ffff; }
        .conv-item.active { border-color:#00ffff; background:#00ffff11; }
        .sidebar-footer { text-align:center; font-size:10px; color:#444; padding-top:8px; border-top:1px solid #00ffff22; }
        
        .main { flex:1; display:flex; flex-direction:column; }
        .header { padding:15px 20px; background:#111122; border-bottom:1px solid #00ffff33; display:flex; justify-content:space-between; align-items:center; }
        .header-title { font-size:15px; font-weight:700; color:#fff; }
        .status { color:#00ffff; font-size:12px; display:flex; align-items:center; gap:6px; }
        .dot { width:8px; height:8px; border-radius:50%; background:#00ffff; box-shadow:0 0 10px #00ffff; }
        
        .chat-area { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
        .message { max-width:75%; padding:12px 16px; border-radius:14px; line-height:1.7; font-size:14px; }
        .user-msg { align-self:flex-start; background:linear-gradient(135deg,#1a2a6c,#0d47a1); color:#fff; }
        .ai-msg { align-self:flex-end; background:#1a1a2e; border:1px solid #00ffff33; }
        .tag { font-size:10px; color:#00ffff; margin-top:5px; }
        
        .input-area { padding:15px 20px; background:#111122; border-top:1px solid #00ffff33; }
        .input-container { display:flex; gap:10px; }
        textarea { flex:1; padding:12px; background:#1a1a2e; border:1px solid #00ffff33; border-radius:10px; color:#fff; font-family:inherit; resize:none; min-height:45px; max-height:140px; font-size:14px; outline:none; }
        textarea:focus { border-color:#00ffff; }
        .btn-send { padding:12px 20px; background:linear-gradient(135deg,#00ffff,#0088ff); color:#000; border:none; border-radius:10px; font-weight:700; cursor:pointer; font-size:16px; }
        .btn-send:disabled { opacity:0.4; cursor:not-allowed; }
        .toolbar { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
        .tool-btn { padding:8px 12px; background:#1a1a2e; border:1px solid #00ffff33; color:#00ffff; border-radius:8px; cursor:pointer; font-size:12px; }
        .tool-btn:hover { background:#00ffff22; }
        img { max-width:280px; border-radius:10px; margin-top:8px; }
        audio { margin-top:8px; width:100%; }
        .typing { display:inline-flex; gap:4px; }
        .typing span { width:6px; height:6px; border-radius:50%; background:#00ffff; animation:bounce 1.2s infinite; }
        .typing span:nth-child(2) { animation-delay:0.2s; }
        .typing span:nth-child(3) { animation-delay:0.4s; }
        @keyframes bounce { 0%,60%,100%{transform:translateY(0);} 30%{transform:translateY(-6px);} }
    </style>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
</head>
<body>
    <div class="sidebar">
        <div class="logo">⚡ YZ</div>
        <button class="btn-new" onclick="newChat()">+ گفتگوی جدید</button>
        <div class="history" id="historyList">
            <div class="history-title">📋 تاریخچه</div>
        </div>
        <div class="sidebar-footer">🔮 نسخه ۵.۰</div>
    </div>
    
    <div class="main">
        <div class="header">
            <div class="header-title" id="headerTitle">گفتگوی جدید</div>
            <div class="status"><span class="dot"></span> آنلاین | DeepSeek AI</div>
        </div>
        
        <div class="chat-area" id="chatArea"></div>
        
        <div class="input-area">
            <div class="input-container">
                <textarea id="input" placeholder="پیام خود را بنویسید..." oninput="updateBtn()" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
                <button class="btn-send" id="sendBtn" onclick="sendMessage()" disabled>🚀</button>
            </div>
            <div class="toolbar">
                <button class="tool-btn" onclick="generateImage()">🎨 تصویر</button>
                <button class="tool-btn" onclick="generateMusic()">🎵 موسیقی</button>
                <button class="tool-btn" onclick="uploadFile()">📎 فایل</button>
                <button class="tool-btn" onclick="speakLast()">🔊 گفتار</button>
            </div>
            <input type="file" id="fileInput" style="display:none" multiple accept="image/*,audio/*,video/*,.pdf,.txt">
        </div>
    </div>

    <script>
        const WORKER_URL = 'https://twilight-bird-de54.amirmohad208.workers.dev/';
        const chatArea = document.getElementById('chatArea');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const headerTitle = document.getElementById('headerTitle');
        
        let conversations = [];
        let messages = [];
        let currentConvId = null;
        let isGenerating = false;

        function loadDB() {
            const saved = localStorage.getItem('yz_db');
            if (saved) {
                const data = JSON.parse(saved);
                conversations = data.conversations || [];
                messages = data.messages || [];
                if (conversations.length > 0) loadConversation(conversations[0].id);
            }
        }
        function saveDB() { localStorage.setItem('yz_db', JSON.stringify({conversations, messages})); }
        function newChat() {
            currentConvId = null;
            headerTitle.textContent = 'گفتگوی جدید';
            chatArea.innerHTML = '';
            input.value = '';
            updateBtn();
            updateHistory();
        }
        function addMessage(role, content, type='text', extra='') {
            const div = document.createElement('div');
            div.className = role === 'user' ? 'message user-msg' : 'message ai-msg';
            if (type === 'image') div.innerHTML = `<div>🎨 تصویر:</div><img src="${content}" onerror="this.src='https://via.placeholder.com/280x280/1a1a2e/00ffff?text=AI'"><div class="tag">🎨 Pollinations</div>`;
            else if (type === 'file') div.innerHTML = `<div>📎 ${content}</div><div class="tag">📎 فایل</div>`;
            else if (type === 'audio') div.innerHTML = `<div>🎵 موسیقی:</div><audio controls src="${content}"></audio><div class="tag">🎵 Music</div>`;
            else div.innerHTML = `<div>${content.replace(/\n/g,'<br>')}</div><div class="tag">🧠 DeepSeek</div>`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        function addTyping() {
            const div = document.createElement('div');
            div.className = 'message ai-msg';
            div.id = 'typing-' + Date.now();
            div.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div.id;
        }
        function removeTyping(id) { const el = document.getElementById(id); if (el) el.remove(); }

        async function sendMessage() {
            const prompt = input.value.trim();
            if (!prompt || isGenerating) return;
            isGenerating = true;
            sendBtn.disabled = true;
            
            if (!currentConvId) {
                const conv = { id: Date.now(), title: prompt.substring(0,35), createdAt: new Date().toISOString(), count: 0 };
                conversations.unshift(conv);
                currentConvId = conv.id;
                headerTitle.textContent = conv.title;
            }
            
            addMessage('user', prompt);
            messages.push({ convId: currentConvId, role: 'user', content: prompt });
            input.value = '';
            updateBtn();
            
            const typingId = addTyping();
            
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt }),
                });
                const data = await response.json();
                removeTyping(typingId);
                
                let text = '';
                if (data.choices && data.choices[0]) text = data.choices[0].message.content;
                else if (data.error) text = 'خطا: ' + data.error.message;
                else text = 'پاسخی دریافت نشد.';
                
                addMessage('ai', text);
                messages.push({ convId: currentConvId, role: 'ai', content: text });
                
                const conv = conversations.find(c => c.id === currentConvId);
                if (conv) conv.count = messages.filter(m => m.convId === currentConvId).length;
                saveDB();
                updateHistory();
            } catch(err) {
                removeTyping(typingId);
                addMessage('ai', 'خطا: ' + err.message);
            } finally {
                isGenerating = false;
                sendBtn.disabled = false;
            }
        }

        function generateImage() {
            const prompt = input.value.trim() || 'cyberpunk city';
            addMessage('user', `🎨 تصویر: ${prompt}`);
            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&seed=${Date.now()}`;
            addMessage('ai', url, 'image');
            input.value = '';
            updateBtn();
        }

        function generateMusic() {
            const prompt = input.value.trim() || 'relaxing music';
            addMessage('user', `🎵 موسیقی: ${prompt}`);
            addMessage('ai', `🎵 در حال ساخت "${prompt}"...\n\nنسخه نمایشی موسیقی آماده است.`);
            input.value = '';
            updateBtn();
        }

        function uploadFile() { document.getElementById('fileInput').click(); }
        document.getElementById('fileInput').addEventListener('change', function(e) {
            for (const file of e.target.files) {
                const size = (file.size/1024).toFixed(1) + ' KB';
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = ev => addMessage('user', ev.target.result, 'image');
                    reader.readAsDataURL(file);
                } else {
                    addMessage('user', file.name + ' (' + size + ')', 'file');
                }
            }
            this.value = '';
        });

        function speakLast() {
            const last = messages[messages.length-1];
            if (last && last.role === 'ai') {
                const u = new SpeechSynthesisUtterance(last.content);
                u.lang = 'fa-IR';
                speechSynthesis.speak(u);
            }
        }

        function updateBtn() {
            sendBtn.disabled = input.value.trim().length === 0;
        }
        function updateHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '<div class="history-title">📋 تاریخچه</div>';
            conversations.forEach(conv => {
                const item = document.createElement('div');
                item.className = 'conv-item' + (conv.id === currentConvId ? ' active' : '');
                item.innerHTML = `<div>${conv.title}</div><small style="color:#888">${conv.count || 0} پیام</small>`;
                item.onclick = () => loadConversation(conv.id);
                list.appendChild(item);
            });
        }
        function loadConversation(convId) {
            const conv = conversations.find(c => c.id === convId);
            if (!conv) return;
            currentConvId = convId;
            headerTitle.textContent = conv.title;
            chatArea.innerHTML = '';
            messages.filter(m => m.convId === convId).forEach(m => addMessage(m.role, m.content));
            updateHistory();
        }

        loadDB();
        updateHistory();
        updateBtn();
    </script>
</body>
</html>
