<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ YZ - هوش مصنوعی کامل</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --bg2: #111122;
            --bg3: #1a1a2e;
            --neon: #00ffff;
            --neon2: #0088ff;
            --danger: #ff0044;
            --text: #e0e0e0;
            --text2: #ffffff;
            --border: #00ffff33;
            --radius: 16px;
            --radius-sm: 10px;
            --gradient: linear-gradient(135deg, #00ffff, #0088ff);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Vazirmatn',Tahoma; background:var(--bg); color:var(--text); height:100vh; display:flex; overflow:hidden; direction:rtl; }
        
        /* Sidebar */
        .sidebar { width:280px; background:var(--bg2); border-left:1px solid var(--border); display:flex; flex-direction:column; padding:20px 15px; gap:12px; position:relative; }
        .logo { text-align:center; font-size:28px; font-weight:900; color:var(--neon); text-shadow:0 0 30px var(--neon),0 0 60px rgba(0,255,255,0.3); animation:logoGlow 3s infinite; }
        @keyframes logoGlow { 0%,100%{text-shadow:0 0 30px var(--neon),0 0 60px rgba(0,255,255,0.3);} 50%{text-shadow:0 0 50px var(--neon),0 0 100px rgba(0,255,255,0.5);} }
        .btn-new { padding:14px; background:var(--gradient); color:#000; border:none; border-radius:var(--radius); font-weight:700; font-size:14px; cursor:pointer; transition:0.3s; position:relative; overflow:hidden; }
        .btn-new:hover { transform:scale(1.03); box-shadow:0 6px 30px rgba(0,255,255,0.5); }
        .btn-new::after { content:''; position:absolute; top:-50%; left:-50%; width:200%; height:200%; background:radial-gradient(circle,rgba(255,255,255,0.3) 0%,transparent 60%); animation:shine 3s infinite; }
        @keyframes shine { 0%,100%{transform:translate(-30%,-30%);opacity:0;} 50%{transform:translate(30%,30%);opacity:0.6;} }
        
        .history { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; }
        .history-title { font-size:11px; color:#666; padding:8px 4px; border-bottom:1px solid var(--border); margin-bottom:5px; letter-spacing:1px; }
        .conv-item { padding:12px; background:var(--bg3); border:1px solid transparent; border-radius:var(--radius-sm); cursor:pointer; font-size:12px; transition:0.3s; position:relative; }
        .conv-item:hover { border-color:var(--neon); background:rgba(0,255,255,0.05); box-shadow:0 0 15px rgba(0,255,255,0.15); }
        .conv-item.active { border-color:var(--neon); background:rgba(0,255,255,0.08); box-shadow:0 0 20px rgba(0,255,255,0.2); }
        .conv-title { font-weight:600; color:var(--text2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .conv-meta { font-size:10px; color:#888; margin-top:4px; }
        .conv-delete { position:absolute; top:8px; left:8px; width:22px; height:22px; border-radius:50%; background:rgba(255,0,68,0.15); border:1px solid rgba(255,0,68,0.3); color:var(--danger); font-size:10px; display:none; align-items:center; justify-content:center; cursor:pointer; }
        .conv-item:hover .conv-delete { display:flex; }
        .sidebar-footer { text-align:center; font-size:10px; color:#444; padding-top:10px; border-top:1px solid var(--border); }
        
        /* Main */
        .main { flex:1; display:flex; flex-direction:column; }
        .header { padding:15px 25px; background:var(--bg2); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
        .header-title { font-size:16px; font-weight:700; color:var(--text2); }
        .status { display:flex; align-items:center; gap:8px; color:var(--neon); font-size:12px; }
        .dot { width:10px; height:10px; border-radius:50%; background:var(--neon); box-shadow:0 0 15px var(--neon); animation:pulse 2s infinite; }
        @keyframes pulse { 0%,100%{box-shadow:0 0 15px var(--neon);} 50%{box-shadow:0 0 30px var(--neon);} }
        
        .chat-area { flex:1; overflow-y:auto; padding:25px; display:flex; flex-direction:column; gap:15px; }
        .message { max-width:75%; padding:14px 18px; border-radius:var(--radius); line-height:1.7; font-size:14px; animation:msgIn 0.4s ease; position:relative; }
        @keyframes msgIn { from{opacity:0; transform:translateY(20px) scale(0.95);} to{opacity:1; transform:translateY(0) scale(1);} }
        .user-msg { align-self:flex-start; background:linear-gradient(135deg,#1a2a6c,#0d47a1); color:#fff; border-bottom-right-radius:4px; box-shadow:0 4px 20px rgba(13,71,161,0.4); }
        .ai-msg { align-self:flex-end; background:var(--bg3); border:1px solid var(--border); border-bottom-left-radius:4px; box-shadow:0 0 20px rgba(0,255,255,0.1); }
        .tag { font-size:10px; color:var(--neon); margin-top:6px; display:inline-block; padding:2px 10px; border-radius:20px; background:rgba(0,255,255,0.1); border:1px solid rgba(0,255,255,0.2); }
        .user-msg .tag { background:rgba(255,255,255,0.15); color:rgba(255,255,255,0.7); border-color:rgba(255,255,255,0.2); }
        
        .typing { display:inline-flex; gap:5px; }
        .typing span { width:8px; height:8px; border-radius:50%; background:var(--neon); animation:bounce 1.4s infinite; }
        .typing span:nth-child(2) { animation-delay:0.2s; }
        .typing span:nth-child(3) { animation-delay:0.4s; }
        @keyframes bounce { 0%,60%,100%{transform:translateY(0);opacity:0.4;} 30%{transform:translateY(-8px);opacity:1;} }
        
        img { max-width:300px; border-radius:var(--radius-sm); margin-top:10px; border:1px solid var(--border); }
        audio { margin-top:10px; width:100%; }
        
        /* Input */
        .input-area { padding:20px 25px; background:var(--bg2); border-top:1px solid var(--border); }
        .input-container { display:flex; gap:12px; align-items:flex-end; background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius); padding:12px 16px; transition:0.3s; }
        .input-container:focus-within { border-color:var(--neon); box-shadow:0 0 30px rgba(0,255,255,0.2); }
        textarea { flex:1; background:transparent; border:none; color:var(--text); font-family:inherit; font-size:14px; resize:none; min-height:45px; max-height:150px; line-height:1.6; outline:none; }
        .btn-send { padding:12px 22px; background:var(--gradient); color:#000; border:none; border-radius:var(--radius-sm); font-weight:700; cursor:pointer; font-size:16px; transition:0.3s; }
        .btn-send:hover { transform:translateY(-2px); box-shadow:0 6px 30px rgba(0,255,255,0.5); }
        .btn-send:disabled { opacity:0.4; cursor:not-allowed; transform:none; }
        .char-count { font-size:10px; color:#666; text-align:left; margin-top:5px; }
        .toolbar { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
        .tool-btn { padding:9px 14px; background:var(--bg3); border:1px solid var(--border); color:var(--neon); border-radius:var(--radius-sm); cursor:pointer; font-size:12px; transition:0.3s; display:flex; align-items:center; gap:5px; }
        .tool-btn:hover { background:rgba(0,255,255,0.08); border-color:var(--neon); box-shadow:0 0 15px rgba(0,255,255,0.2); transform:translateY(-1px); }
    </style>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
</head>
<body>
    <div class="sidebar">
        <div class="logo">⚡ YZ</div>
        <button class="btn-new" onclick="newChat()">+ گفتگوی جدید</button>
        <div class="history" id="historyList">
            <div class="history-title">📋 تاریخچه گفتگوها</div>
        </div>
        <div class="sidebar-footer">🔮 نسخه ۵.۰ | همه‌چیزتمام</div>
    </div>
    
    <div class="main">
        <div class="header">
            <div class="header-title" id="headerTitle">گفتگوی جدید</div>
            <div class="status"><span class="dot"></span> ● آنلاین | YZ Core</div>
        </div>
        
        <div class="chat-area" id="chatArea"></div>
        
        <div class="input-area">
            <div class="input-container">
                <textarea id="input" placeholder="پیام خود را بنویسید..." oninput="updateBtn()" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
                <button class="btn-send" id="sendBtn" onclick="sendMessage()" disabled>🚀</button>
            </div>
            <div class="char-count" id="charCount">۰ / ۱۰,۰۰۰</div>
            <div class="toolbar">
                <button class="tool-btn" onclick="generateImage()">🎨 تصویر</button>
                <button class="tool-btn" onclick="generateMusic()">🎵 موسیقی</button>
                <button class="tool-btn" onclick="uploadFile()">📎 فایل</button>
                <button class="tool-btn" onclick="startVoice()">🎤 صدا</button>
                <button class="tool-btn" onclick="speakLast()">🔊 گفتار</button>
            </div>
            <input type="file" id="fileInput" style="display:none" multiple accept="image/*,audio/*,video/*,.pdf,.txt">
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('sendBtn');
        const headerTitle = document.getElementById('headerTitle');
        
        let conversations = [];
        let messages = [];
        let currentConvId = null;
        let isGenerating = false;
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        function loadDB() {
            const saved = localStorage.getItem('yz_db');
            if (saved) {
                const data = JSON.parse(saved);
                conversations = data.conversations || [];
                messages = data.messages || [];
                if (conversations.length > 0) loadConversation(conversations[0].id);
            }
        }
        function saveDB() { localStorage.setItem('yz_db', JSON.stringify({conversations, messages})); }
        function newChat() {
            currentConvId = null;
            headerTitle.textContent = 'گفتگوی جدید';
            chatArea.innerHTML = '';
            input.value = '';
            updateBtn();
            updateHistory();
        }
        function addMessage(role, content, type='text', extra='') {
            const div = document.createElement('div');
            div.className = role === 'user' ? 'message user-msg' : 'message ai-msg';
            if (type === 'image') div.innerHTML = `<div>🎨 تصویر:</div><img src="${content}" onerror="this.src='https://via.placeholder.com/280x280/1a1a2e/00ffff?text=AI'"><div class="tag">🎨 Pollinations AI</div>`;
            else if (type === 'file') div.innerHTML = `<div>📎 ${content}</div><div class="tag">📎 فایل</div>`;
            else if (type === 'audio') div.innerHTML = `<div>🎵 موسیقی:</div><audio controls src="${content}"></audio><div class="tag">🎵 AI Music</div>`;
            else if (type === 'voice') div.innerHTML = `<div>🎤 پیام صوتی:</div><audio controls src="${content}"></audio><div class="tag">🎤 Voice</div>`;
            else div.innerHTML = `<div>${content.replace(/\n/g,'<br>')}</div><div class="tag">🧠 YZ AI</div>`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        function addTyping() {
            const div = document.createElement('div');
            div.className = 'message ai-msg';
            div.id = 'typing-' + Date.now();
            div.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div.id;
        }
        function removeTyping(id) { const el = document.getElementById(id); if (el) el.remove(); }

        async function sendMessage() {
            const prompt = input.value.trim();
            if (!prompt || isGenerating) return;
            isGenerating = true;
            sendBtn.disabled = true;
            
            if (!currentConvId) {
                const conv = { id: Date.now(), title: prompt.substring(0,35), createdAt: new Date().toISOString(), count: 0 };
                conversations.unshift(conv);
                currentConvId = conv.id;
                headerTitle.textContent = conv.title;
            }
            
            addMessage('user', prompt);
            messages.push({ convId: currentConvId, role: 'user', content: prompt });
            input.value = '';
            updateBtn();
            
            const typingId = addTyping();
            
            try {
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}?model=openai`);
                const text = await response.text();
                removeTyping(typingId);
                addMessage('ai', text);
                messages.push({ convId: currentConvId, role: 'ai', content: text });
                const conv = conversations.find(c => c.id === currentConvId);
                if (conv) conv.count = messages.filter(m => m.convId === currentConvId).length;
                saveDB();
                updateHistory();
            } catch(err) {
                removeTyping(typingId);
                addMessage('ai', 'متأسفم، خطایی رخ داد. لطفاً دوباره تلاش کنید.');
            } finally {
                isGenerating = false;
                sendBtn.disabled = false;
            }
        }

        function generateImage() {
            const prompt = input.value.trim() || 'cyberpunk city with neon lights';
            addMessage('user', `🎨 تصویر: ${prompt}`);
            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&seed=${Date.now()}`;
            addMessage('ai', url, 'image');
            input.value = '';
            updateBtn();
        }

        function generateMusic() {
            const prompt = input.value.trim() || 'relaxing ambient music';
            addMessage('user', `🎵 موسیقی: ${prompt}`);
            addMessage('ai', `🎵 در حال ساخت "${prompt}"...\n\nتوضیح: یک قطعه ${prompt} با ملودی آرام و دلنشین.`);
            input.value = '';
            updateBtn();
        }

        function uploadFile() { document.getElementById('fileInput').click(); }
        document.getElementById('fileInput').addEventListener('change', function(e) {
            for (const file of e.target.files) {
                const size = (file.size/1024).toFixed(1) + ' KB';
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = ev => addMessage('user', ev.target.result, 'image');
                    reader.readAsDataURL(file);
                } else if (file.type.startsWith('audio/')) {
                    const url = URL.createObjectURL(file);
                    addMessage('user', url, 'audio');
                } else {
                    addMessage('user', file.name + ' (' + size + ')', 'file');
                }
            }
            this.value = '';
        });

        async function startVoice() {
            const btn = document.querySelector('.tool-btn:nth-child(4)');
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => {
                        const blob = new Blob(audioChunks, { type: 'audio/webm' });
                        const url = URL.createObjectURL(blob);
                        addMessage('user', url, 'voice');
                        stream.getTracks().forEach(t => t.stop());
                    };
                    mediaRecorder.start();
                    isRecording = true;
                    btn.textContent = '⏹️ توقف';
                    btn.style.background = 'rgba(255,0,68,0.15)';
                    btn.style.borderColor = '#ff0044';
                    btn.style.color = '#ff0044';
                } catch(err) {
                    alert('دسترسی به میکروفون ممکن نیست');
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                btn.textContent = '🎤 صدا';
                btn.style.background = '';
                btn.style.borderColor = '';
                btn.style.color = '';
            }
        }

        function speakLast() {
            const last = messages[messages.length-1];
            if (last && last.role === 'ai') {
                const u = new SpeechSynthesisUtterance(last.content);
                u.lang = 'fa-IR';
                speechSynthesis.speak(u);
            }
        }

        function updateBtn() {
            sendBtn.disabled = input.value.trim().length === 0;
            document.getElementById('charCount').textContent = input.value.length.toLocaleString('fa-IR') + ' / ۱۰,۰۰۰';
            input.style.height = 'auto';
            input.style.height = Math.min(input.scrollHeight, 150) + 'px';
        }
        function updateHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '<div class="history-title">📋 تاریخچه گفتگوها</div>';
            conversations.forEach(conv => {
                const item = document.createElement('div');
                item.className = 'conv-item' + (conv.id === currentConvId ? ' active' : '');
                item.innerHTML = `<div class="conv-title">${conv.title}</div><div class="conv-meta">${conv.count || 0} پیام</div><button class="conv-delete" onclick="event.stopPropagation();deleteConv(${conv.id})">✕</button>`;
                item.onclick = () => loadConversation(conv.id);
                list.appendChild(item);
            });
        }
        function loadConversation(convId) {
            const conv = conversations.find(c => c.id === convId);
            if (!conv) return;
            currentConvId = convId;
            headerTitle.textContent = conv.title;
            chatArea.innerHTML = '';
            messages.filter(m => m.convId === convId).forEach(m => addMessage(m.role, m.content));
            updateHistory();
        }
        function deleteConv(convId) {
            if (!confirm('حذف این گفتگو؟')) return;
            conversations = conversations.filter(c => c.id !== convId);
            messages = messages.filter(m => m.convId !== convId);
            if (currentConvId === convId) newChat();
            saveDB();
            updateHistory();
        }

        loadDB();
        updateHistory();
        updateBtn();
    </script>
</body>
</html>
