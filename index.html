<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ YZ - وای زد | هوش مصنوعی کامل</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Vazirmatn',Tahoma; background:#0a0a0f; color:#e0e0e0; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
        .header { padding:15px 20px; background:#111122; border-bottom:1px solid #00ffff33; display:flex; justify-content:space-between; align-items:center; }
        .logo { font-size:24px; font-weight:900; color:#00ffff; text-shadow:0 0 20px #00ffff; }
        .status { color:#00ffff; font-size:14px; }
        .chat-area { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
        .message { max-width:80%; padding:12px 16px; border-radius:15px; line-height:1.6; }
        .user-msg { align-self:flex-start; background:linear-gradient(135deg,#1a2a6c,#0d47a1); color:white; }
        .ai-msg { align-self:flex-end; background:#1a1a2e; border:1px solid #00ffff33; }
        .tag { font-size:11px; color:#00ffff; margin-top:5px; }
        .input-area { padding:15px 20px; background:#111122; border-top:1px solid #00ffff33; }
        .input-container { display:flex; gap:10px; }
        textarea { flex:1; padding:12px; background:#1a1a2e; border:1px solid #00ffff33; border-radius:10px; color:#fff; font-family:inherit; resize:none; min-height:50px; max-height:150px; }
        button { padding:12px 20px; background:linear-gradient(135deg,#00ffff,#0088ff); color:#000; border:none; border-radius:10px; cursor:pointer; font-weight:bold; font-family:inherit; }
        button:hover { opacity:0.8; }
        .toolbar { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
        .tool-btn { padding:8px 14px; background:#1a1a2e; border:1px solid #00ffff33; color:#00ffff; border-radius:8px; cursor:pointer; font-size:13px; }
        .tool-btn:hover { background:#00ffff22; }
        img { max-width:300px; border-radius:10px; margin-top:10px; }
        audio { margin-top:10px; width:100%; }
    </style>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
</head>
<body>
    <div class="header">
        <div class="logo">⚡ YZ | هوش مصنوعی کامل</div>
        <div class="status">● آنلاین | رایگان</div>
    </div>
    
    <div class="chat-area" id="chatArea"></div>
    
    <div class="input-area">
        <div class="input-container">
            <textarea id="input" placeholder="پیام خود را بنویسید... (Shift+Enter برای خط جدید)" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
            <button onclick="sendMessage()">🚀 ارسال</button>
        </div>
        <div class="toolbar">
            <button class="tool-btn" onclick="generateImage()">🎨 تولید تصویر</button>
            <button class="tool-btn" onclick="generateMusic()">🎵 تولید موسیقی</button>
            <button class="tool-btn" onclick="startVoice()">🎤 گفتار صوتی</button>
            <button class="tool-btn" onclick="speakLast()">🔊 خواندن پاسخ</button>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chatArea');
        const input = document.getElementById('input');

        function addMessage(role, content, type = 'text') {
            const div = document.createElement('div');
            div.className = role === 'user' ? 'message user-msg' : 'message ai-msg';
            
            if (type === 'image') {
                div.innerHTML = `<div>🎨 تصویر تولید شد:</div><img src="${content}" alt="Generated Image"><div class="tag">🎨 Pollinations AI</div>`;
            } else if (type === 'audio') {
                div.innerHTML = `<div>🎵 موسیقی تولید شد:</div><audio controls src="${content}"></audio><div class="tag">🎵 Pollinations Music</div>`;
            } else {
                div.innerHTML = `<div>${content}</div><div class="tag">🌟 YZ AI</div>`;
            }
            
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function sendMessage() {
            const prompt = input.value.trim();
            if (!prompt) return;
            
            addMessage('user', prompt);
            input.value = '';
            
            try {
                // استفاده از Pollinations AI - رایگان و بدون کلید
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
                const text = await response.text();
                addMessage('ai', text);
            } catch(err) {
                addMessage('ai', 'متأسفم، خطایی رخ داد. دوباره تلاش کنید.');
            }
        }

        async function generateImage() {
            const prompt = input.value.trim() || 'cyberpunk city';
            addMessage('user', `🎨 تصویر: ${prompt}`);
            
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512`;
            addMessage('ai', imageUrl, 'image');
            input.value = '';
        }

        async function generateMusic() {
            const prompt = input.value.trim() || 'relaxing ambient music';
            addMessage('user', `🎵 موسیقی: ${prompt}`);
            
            // Pollinations می‌تواند متن موسیقی تولید کند
            const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent('Describe a music piece: ' + prompt)}`);
            const text = await response.text();
            addMessage('ai', '🎵 توضیح موسیقی:\n' + text);
            input.value = '';
        }

        function startVoice() {
            // استفاده از Web Speech API برای تشخیص گفتار
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'fa-IR';
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                input.value = text;
                sendMessage();
            };
            recognition.start();
            addMessage('ai', '🎤 در حال گوش دادن... صحبت کنید');
        }

        function speakLast() {
            const messages = document.querySelectorAll('.ai-msg');
            if (messages.length > 0) {
                const lastText = messages[messages.length - 1].textContent;
                const utterance = new SpeechSynthesisUtterance(lastText);
                utterance.lang = 'fa-IR';
                speechSynthesis.speak(utterance);
            }
        }

        // پیام خوش آمد
        addMessage('ai', 'سلام! من YZ هستم. چطور می‌توانم کمک کنم؟\n\nمی‌توانید:\n💬 چت کنید\n🎨 تصویر تولید کنید\n🎵 موسیقی بسازید\n🎤 با صدا صحبت کنید');
    </script>
</body>
</html>
