<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ YZ - وای زد | همه‌چیزتمام</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Vazirmatn',Tahoma; background:#0a0a0f; color:#e0e0e0; height:100vh; display:flex; flex-direction:column; overflow:hidden; direction:rtl; }
        .header { padding:15px 20px; background:#111122; border-bottom:1px solid #00ffff33; display:flex; justify-content:space-between; align-items:center; }
        .logo { font-size:24px; font-weight:900; color:#00ffff; text-shadow:0 0 20px #00ffff; }
        .status { color:#00ffff; font-size:14px; }
        .chat-area { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
        .message { max-width:80%; padding:12px 16px; border-radius:15px; line-height:1.6; }
        .user-msg { align-self:flex-start; background:linear-gradient(135deg,#1a2a6c,#0d47a1); color:white; }
        .ai-msg { align-self:flex-end; background:#1a1a2e; border:1px solid #00ffff33; }
        .tag { font-size:11px; color:#00ffff; margin-top:5px; }
        .input-area { padding:15px 20px; background:#111122; border-top:1px solid #00ffff33; }
        .input-container { display:flex; gap:10px; }
        textarea { flex:1; padding:12px; background:#1a1a2e; border:1px solid #00ffff33; border-radius:10px; color:#fff; font-family:inherit; resize:none; min-height:50px; max-height:150px; }
        button { padding:12px 20px; background:linear-gradient(135deg,#00ffff,#0088ff); color:#000; border:none; border-radius:10px; cursor:pointer; font-weight:bold; font-family:inherit; }
        button:hover { opacity:0.8; }
        .toolbar { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
        .tool-btn { padding:8px 14px; background:#1a1a2e; border:1px solid #00ffff33; color:#00ffff; border-radius:8px; cursor:pointer; font-size:13px; }
        .tool-btn:hover { background:#00ffff22; }
        select { padding:10px; background:#1a1a2e; border:1px solid #00ffff33; color:#00ffff; border-radius:8px; font-family:inherit; }
        img { max-width:300px; border-radius:10px; margin-top:10px; }
    </style>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
</head>
<body>
    <div class="header">
        <div class="logo">⚡ YZ | همه‌چیزتمام</div>
        <div class="status">● آنلاین</div>
    </div>
    
    <div class="chat-area" id="chatArea"></div>
    
    <div class="input-area">
        <select id="modelSelect">
            <option value="auto">🤖 خودکار</option>
            <option value="gemini">🌟 Gemini Pro</option>
            <option value="openai">🧠 GPT-4o</option>
            <option value="claude">💎 Claude</option>
        </select>
        <div class="input-container" style="margin-top:10px;">
            <textarea id="input" placeholder="پیام خود را بنویسید..." onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
            <button onclick="sendMessage()">🚀 ارسال</button>
        </div>
        <div class="toolbar">
            <button class="tool-btn" onclick="generateImage()">🎨 تصویر</button>
            <button class="tool-btn" onclick="generateMusic()">🎵 موسیقی</button>
            <button class="tool-btn" onclick="searchNews()">📰 خبر</button>
            <button class="tool-btn" onclick="startVoice()">🎤 صدا</button>
            <button class="tool-btn" onclick="speakLast()">🔊 گفتار</button>
        </div>
    </div>

    <script>
        const WORKER_URL = 'https://twilight-bird-de54.amirmohad208.workers.dev/';
        const chatArea = document.getElementById('chatArea');
        const input = document.getElementById('input');

        function addMessage(role, content, model = 'auto') {
            const div = document.createElement('div');
            div.className = role === 'user' ? 'message user-msg' : 'message ai-msg';
            div.innerHTML = `<div>${content}</div><div class="tag">${model}</div>`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        async function sendMessage() {
            const prompt = input.value.trim();
            if (!prompt) return;
            
            const model = document.getElementById('modelSelect').value;
            addMessage('user', prompt);
            input.value = '';
            
            addMessage('ai', '⏳ در حال پردازش...', 'سیستم');
            
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target: model, prompt: prompt }),
                });
                const data = await response.json();
                
                // حذف پیام "در حال پردازش"
                const msgs = chatArea.querySelectorAll('.ai-msg');
                if (msgs.length > 0) msgs[msgs.length - 1].remove();
                
                if (data.candidates && data.candidates[0]) {
                    const text = data.candidates[0].content.parts[0].text;
                    addMessage('ai', text, '🌟 Gemini Pro');
                } else if (data.choices && data.choices[0]) {
                    const text = data.choices[0].message.content;
                    addMessage('ai', text, '🧠 GPT-4o');
                } else if (data.content && data.content[0]) {
                    const text = data.content[0].text;
                    addMessage('ai', text, '💎 Claude');
                } else if (data.error) {
                    addMessage('ai', 'خطا: ' + (data.error.message || JSON.stringify(data.error)), 'سیستم');
                } else {
                    addMessage('ai', 'پاسخی دریافت نشد.', 'سیستم');
                }
            } catch(err) {
                const msgs = chatArea.querySelectorAll('.ai-msg');
                if (msgs.length > 0) msgs[msgs.length - 1].remove();
                addMessage('ai', 'خطا در ارتباط: ' + err.message, 'سیستم');
            }
        }

        async function generateImage() {
            const prompt = input.value.trim() || 'cyberpunk city';
            addMessage('user', `🎨 تصویر: ${prompt}`);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512`;
            const div = document.createElement('div');
            div.className = 'message ai-msg';
            div.innerHTML = `<div>🎨 تصویر تولید شد:</div><img src="${imageUrl}" alt="Generated"><div class="tag">🎨 Pollinations</div>`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            input.value = '';
        }

        async function generateMusic() {
            const prompt = input.value.trim() || 'relaxing music';
            addMessage('user', `🎵 موسیقی: ${prompt}`);
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target: 'gemini', prompt: 'Describe a music piece: ' + prompt }),
                });
                const data = await response.json();
                if (data.candidates && data.candidates[0]) {
                    addMessage('ai', '🎵 ' + data.candidates[0].content.parts[0].text, '🎵 Music AI');
                }
            } catch(err) {
                addMessage('ai', '🎵 موسیقی در حال ساخت است...', '🎵 Music AI');
            }
            input.value = '';
        }

        async function searchNews() {
            const query = input.value.trim() || 'تکنولوژی';
            addMessage('user', `📰 خبر: ${query}`);
            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target: 'news', prompt: query }),
                });
                const data = await response.json();
                if (data.articles) {
                    let newsText = '📰 اخبار:\n\n';
                    data.articles.slice(0, 5).forEach((article, i) => {
                        newsText += `${i+1}. ${article.title}\n${article.description || ''}\n\n`;
                    });
                    addMessage('ai', newsText, '📰 NewsAPI');
                } else {
                    addMessage('ai', 'خبری یافت نشد.', '📰 NewsAPI');
                }
            } catch(err) {
                addMessage('ai', 'خطا در دریافت خبر.', '📰 NewsAPI');
            }
            input.value = '';
        }

        function startVoice() {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'fa-IR';
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                input.value = text;
                sendMessage();
            };
            recognition.start();
            addMessage('ai', '🎤 در حال گوش دادن...', 'سیستم');
        }

        function speakLast() {
            const messages = document.querySelectorAll('.ai-msg');
            if (messages.length > 0) {
                const lastText = messages[messages.length - 1].textContent;
                const utterance = new SpeechSynthesisUtterance(lastText);
                utterance.lang = 'fa-IR';
                speechSynthesis.speak(utterance);
            }
        }

        addMessage('ai', 'سلام! من YZ هستم.\n\nمی‌توانید:\n💬 چت با مدل‌های مختلف\n🎨 تولید تصویر\n🎵 ساخت موسیقی\n📰 جستجوی خبر\n🎤 گفتار صوتی', '⚡ YZ');
    </script>
</body>
</html>
